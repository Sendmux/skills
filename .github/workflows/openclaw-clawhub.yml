name: OpenClaw ClawHub

on:
  pull_request:
    paths:
      - "skills/**"
      - "openclaw.skills.json"
      - "scripts/build-openclaw-bundle.mjs"
      - "scripts/check-openclaw-bundle.mjs"
      - "scripts/publish-openclaw-bundle.mjs"
      - "scripts/publish-openclaw-bundle.test.mjs"
      - ".github/workflows/openclaw-clawhub.yml"
  push:
    branches:
      - main
    paths:
      - "skills/**"
      - "openclaw.skills.json"
      - "scripts/build-openclaw-bundle.mjs"
      - "scripts/check-openclaw-bundle.mjs"
      - "scripts/publish-openclaw-bundle.mjs"
      - "scripts/publish-openclaw-bundle.test.mjs"
      - ".github/workflows/openclaw-clawhub.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish generated Sendmux skills to ClawHub"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: openclaw-clawhub-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and dry-run OpenClaw bundle
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test OpenClaw publisher
        run: node --test scripts/publish-openclaw-bundle.test.mjs

      - name: Generate OpenClaw bundle
        run: node scripts/build-openclaw-bundle.mjs

      - name: Check OpenClaw bundle
        run: node scripts/check-openclaw-bundle.mjs

      - name: Install ClawHub CLI
        run: npm install -g clawhub@0.23.3

      - name: Dry-run ClawHub publish
        run: node scripts/publish-openclaw-bundle.mjs --dry-run

  publish:
    name: Publish OpenClaw bundle
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    needs: validate
    runs-on: ubuntu-latest
    environment: clawhub
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate OpenClaw bundle
        run: node scripts/build-openclaw-bundle.mjs

      - name: Check OpenClaw bundle
        run: node scripts/check-openclaw-bundle.mjs

      - name: Install ClawHub CLI
        run: npm install -g clawhub@0.23.3

      - name: Publish ClawHub skills
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLAWHUB_TOKEN:-}" ]; then
            echo "CLAWHUB_TOKEN is required for ClawHub publication." >&2
            exit 1
          fi

          umask 077
          credential_dir=""
          config_path=""
          publisher_pid=""
          cleanup() {
            status=$?
            trap - EXIT HUP INT TERM
            if [ -n "$config_path" ]; then
              rm -f -- "$config_path"
            fi
            if [ -n "$credential_dir" ]; then
              rmdir -- "$credential_dir"
            fi
            exit "$status"
          }
          stop_publisher() {
            signal="$1"
            status="$2"
            trap - HUP INT TERM
            if [ -n "$publisher_pid" ] && kill -0 "$publisher_pid" 2>/dev/null; then
              kill -s "$signal" "$publisher_pid" 2>/dev/null || true
              wait "$publisher_pid" || true
            fi
            exit "$status"
          }
          trap cleanup EXIT
          trap 'stop_publisher HUP 129' HUP
          trap 'stop_publisher INT 130' INT
          trap 'stop_publisher TERM 143' TERM

          credential_dir="$(mktemp -d "${RUNNER_TEMP:?}/sendmux-clawhub.XXXXXX")"
          config_path="$credential_dir/config.json"
          chmod 700 "$credential_dir"
          export CLAWHUB_CONFIG_PATH="$config_path"
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";

          const config = {
            registry: "https://clawhub.ai",
            token: process.env.CLAWHUB_TOKEN,
          };
          writeFileSync(
            process.env.CLAWHUB_CONFIG_PATH,
            `${JSON.stringify(config)}\n`,
            { encoding: "utf8", flag: "wx", mode: 0o600 },
          );
          NODE
          chmod 600 "$CLAWHUB_CONFIG_PATH"
          unset CLAWHUB_TOKEN

          node scripts/publish-openclaw-bundle.mjs &
          publisher_pid=$!
          wait "$publisher_pid"
