name: Skill drift

# Acceptance uses immutable public source exports and explicit skill reviews.

on:
  pull_request:
    paths:
      - "skills/**"
      - "README.md"
      - "skills.sh.json"
      - "scripts/check-skill-drift.mjs"
      - "scripts/check-skill-drift.test.mjs"
      - "scripts/mailbox-draft-contract-drift.test.mjs"
      - "scripts/skill-compatibility.mjs"
      - "scripts/skill-compatibility.test.mjs"
      - "skill-compatibility.json"
      - "evidence/skill-compatibility/**"
      - ".github/workflows/skill-drift.yml"
  push:
    branches:
      - main
    paths:
      - "skills/**"
      - "README.md"
      - "skills.sh.json"
      - "scripts/check-skill-drift.mjs"
      - "scripts/check-skill-drift.test.mjs"
      - "scripts/mailbox-draft-contract-drift.test.mjs"
      - "scripts/skill-compatibility.mjs"
      - "scripts/skill-compatibility.test.mjs"
      - "skill-compatibility.json"
      - "evidence/skill-compatibility/**"
      - ".github/workflows/skill-drift.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: skill-drift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: Check skill drift vs product surfaces
    runs-on: ubuntu-latest
    steps:
      - name: Check out sendmux-skills
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read pinned public source inputs
        id: source
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from "node:fs";
          const inputs = JSON.parse(readFileSync("skill-compatibility.json")).releaseInputs;
          if (!/^[0-9a-f]{40}$/.test(inputs?.sdkRevision ?? "")) throw new Error("Missing immutable SDK release input");
          appendFileSync(process.env.GITHUB_OUTPUT, `sdk_revision=${inputs.sdkRevision}\napp_openapi=${inputs.app.openapi}\nsending_openapi=${inputs.sending.openapi}\n`);
          JS

      - name: Check out sendmux-sdk (public)
        uses: actions/checkout@v4
        with:
          repository: Sendmux/sendmux-sdk
          ref: ${{ steps.source.outputs.sdk_revision }}
          path: _sdk
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check static claims and candidate compatibility
        env:
          SENDMUX_SKILLS_ROOT: ${{ github.workspace }}
          SENDMUX_SDK: ${{ github.workspace }}/_sdk
          SENDMUX_APP_OPENAPI: ${{ github.workspace }}/${{ steps.source.outputs.app_openapi }}
          SENDMUX_SENDING_OPENAPI: ${{ github.workspace }}/${{ steps.source.outputs.sending_openapi }}
          SKILLS_REVISION: ${{ github.sha }}
          SDK_REVISION: ${{ steps.source.outputs.sdk_revision }}
        run: |
          node --test scripts/check-skill-drift.test.mjs scripts/mailbox-draft-contract-drift.test.mjs scripts/skill-compatibility.test.mjs
          node scripts/check-skill-drift.mjs
          node scripts/skill-compatibility.mjs --prepare-candidate "$RUNNER_TEMP/skill-candidate.json" \
            --skills-root "$GITHUB_WORKSPACE" --revision "$SKILLS_REVISION" \
            --sdk-root "$GITHUB_WORKSPACE/_sdk" --sdk-revision "$SDK_REVISION"
          node scripts/check-skill-drift.mjs --candidate "$RUNNER_TEMP/skill-candidate.json" \
            --receipt "$RUNNER_TEMP/acceptance.json" --source skills --revision "$SKILLS_REVISION"

      - name: Preserve exact skill acceptance
        uses: actions/upload-artifact@v4
        with:
          name: skill-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/acceptance.json
          if-no-files-found: error
